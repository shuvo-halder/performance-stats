# Server Stats Monitor Configuration File
# Customize this file for your deployment

# ============== THRESHOLDS ====================
# CPU usage alert threshold (percentage)
CPU_THRESHOLD=80

# Memory usage alert threshold (percentage)
MEM_THRESHOLD=85

# Disk usage alert threshold (percentage)
DISK_THRESHOLD=90

# ============== SERVICES =====================
# Space-separated list of services to monitor
# Format: SERVICES=("service1" "service2" "service3")
SERVICES=("nginx" "docker" "mysql")

# ============== AUTO-RESTART ====================
# Enable automatic restart of failed services
AUTO_RESTART_FAILED_SERVICES=true

# Number of restart attempts
RESTART_ATTEMPTS=2

# Delay between restart attempts (seconds)
RESTART_DELAY=3

# ============== LOGGING =======================
# Log directory (must be writable by script)
LOG_DIR="/var/log/server-stats"

# Maximum log file size before rotation (in bytes)
# Default: 10MB
LOG_ROTATION_SIZE=$((10 * 1024 * 1024))

# ============== ALERTS ========================
# Enable webhook and email alerts
ENABLE_ALERTS=false

# Webhook URL for alerts (Slack, Teams, custom, etc.)
# Example: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
WEBHOOK_URL=""

# Email recipient for critical alerts
# Example: admin@example.com
EMAIL_RECIPIENT=""

# ============== OUTPUT =======================
# Output metrics as JSON for integration
OUTPUT_JSON=false

# Verbose logging (enable debug messages)
VERBOSE=false

# ============== ADVANCED ====================
# Custom services restart order (optional)
# RESTART_ORDER=("service1" "service2" "service3")

# Service restart timeout (seconds)
SERVICE_RESTART_TIMEOUT=30

# EOF
