version: '3.8'

services:
  backend:
    build: ./backend
    container_name: server-stats-api
    restart: unless-stopped
    # Port 8000 is NOT exposed to host — only accessible via Docker internal network
    # All API access goes through the Nginx reverse proxy on port 8080
    # ports:
    #   - "${API_PORT:-8000}:8000"
    pid: "host"
    volumes:
      - ./backend/data:/app/data
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /var/log:/var/log:ro
      - /etc/os-release:/etc/os-release:ro
      - /run/systemd:/run/systemd:ro
      - /run/dbus:/run/dbus:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/apache2:/var/log/apache2:ro
      - /var/log/httpd:/var/log/httpd:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/server-stats.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-secure-random-key-in-production}
      - MASTER_API_KEY=${MASTER_API_KEY:-sk-prod-server-stats-master-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - CPU_THRESHOLD=${CPU_THRESHOLD:-80}
      - MEM_THRESHOLD=${MEM_THRESHOLD:-85}
      - DISK_THRESHOLD=${DISK_THRESHOLD:-90}
      - SERVICES=${SERVICES:-nginx,docker,mysql}
      - COLLECTION_INTERVAL=${COLLECTION_INTERVAL:-60}
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: server-stats-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - backend
    # All API calls go through Nginx reverse proxy (same origin)
    # REACT_APP_API_URL is empty so the frontend uses relative paths
    # Nginx proxies /api/, /traffic/, /ip/, /ws/ to the backend
    environment:
      - REACT_APP_API_URL=
      - REACT_APP_API_KEY=${MASTER_API_KEY:-sk-prod-server-stats-master-key-2026}
